<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 650" width="750" height="650">
  <defs>
    <linearGradient id="zatcaPhoneBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#091428"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#061b2b"/>
    </linearGradient>
    <linearGradient id="zatcaCardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="750" height="650" fill="url(#zatcaPhoneBg)"/>
  <circle cx="650" cy="100" r="180" fill="#059669" opacity="0.15" filter="blur(60px)"/>
  <circle cx="100" cy="550" r="160" fill="#2563eb" opacity="0.15" filter="blur(50px)"/>

  <!-- Top Status Badge -->
  <g transform="translate(40, 45)">
    <rect width="210" height="34" rx="8" fill="#065f46" fill-opacity="0.6" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="18" cy="17" r="5" fill="#34d399"/>
    <text x="35" y="22" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13" font-weight="700">ZATCA PHASE 2</text>
    <text x="670" y="22" fill="#34d399" font-family="monospace" font-size="13" text-anchor="end">● API LIVE (PORTAL)</text>
  </g>

  <!-- Big Summary Card -->
  <g transform="translate(40, 100)">
    <rect width="670" height="150" rx="20" fill="url(#zatcaCardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">E-INVOICING INTEGRATION</text>
    <text x="25" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="36" font-weight="800">Phase 2 FATOORA</text>
    <text x="25" y="122" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="600">✓ 100% Clearance Rate · Cryptographic Seal</text>
  </g>

  <!-- Split Metrics for Mobile -->
  <g transform="translate(40, 270)">
    <rect width="320" height="120" rx="16" fill="url(#zatcaCardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">CLEARED INVOICES</text>
    <text x="20" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">1,428</text>
    <text x="20" y="100" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">Today · B2B Standard</text>

    <g transform="translate(350, 0)">
      <rect width="320" height="120" rx="16" fill="url(#zatcaCardGrad)" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">AVERAGE LATENCY</text>
      <text x="20" y="75" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="34" font-weight="800">42 ms</text>
      <text x="20" y="100" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Saudi Cloud Nodes</text>
    </g>
  </g>

  <!-- Live QR & Cryptographic Seal Box -->
  <g transform="translate(40, 410)">
    <rect width="670" height="190" rx="20" fill="url(#zatcaCardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Mini QR -->
    <g transform="translate(25, 25)">
      <rect width="140" height="140" rx="12" fill="#ffffff"/>
      <rect x="15" y="15" width="30" height="30" fill="#0f172a"/>
      <rect x="22" y="22" width="16" height="16" fill="#ffffff"/>
      <rect x="95" y="15" width="30" height="30" fill="#0f172a"/>
      <rect x="102" y="22" width="16" height="16" fill="#ffffff"/>
      <rect x="15" y="95" width="30" height="30" fill="#0f172a"/>
      <rect x="22" y="102" width="16" height="16" fill="#ffffff"/>
      <rect x="60" y="30" width="20" height="20" fill="#0f172a"/>
      <rect x="60" y="65" width="25" height="25" fill="#0f172a"/>
      <rect x="95" y="95" width="30" height="30" fill="#0f172a"/>
    </g>

    <g transform="translate(190, 45)">
      <text x="0" y="0" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="700">ECDSA secp256k1 Signed</text>
      <text x="0" y="30" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">UBL 2.1 XML Validated &amp; Chained</text>
      <text x="0" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Ready for ZATCA Waves 1 through 15+</text>
      <text x="0" y="90" fill="#38bdf8" font-family="monospace" font-size="12">STATUS: APPROVED &amp; REPORTED</text>
    </g>
  </g>
</svg>
