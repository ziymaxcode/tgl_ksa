<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="fleetBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09182b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#fleetBg)"/>
  <circle cx="950" cy="200" r="280" fill="#3b82f6" opacity="0.12" filter="blur(70px)"/>
  <circle cx="250" cy="550" r="220" fill="#06b6d4" opacity="0.1" filter="blur(60px)"/>

  <!-- Top Ribbon -->
  <g transform="translate(60, 50)">
    <rect width="230" height="34" rx="8" fill="#1e3a8a" fill-opacity="0.6" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="18" cy="17" r="5" fill="#60a5fa"/>
    <text x="35" y="22" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="13" font-weight="700">WASL PLATFORM INTEGRATED</text>
    <text x="1080" y="24" fill="#94a3b8" font-family="monospace" font-size="14" text-anchor="end">LIVE GPS TRACKING: 48 ACTIVE UNITS</text>
  </g>

  <!-- Main Fleet Dashboard Container -->
  <g transform="translate(60, 110)">
    <rect width="1080" height="570" rx="24" fill="#0f172a" fill-opacity="0.95" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Header -->
    <rect width="1080" height="70" rx="24" fill="#1e293b" fill-opacity="0.8"/>
    <text x="35" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">TGL Telematics Hub · Saudi Commercial Fleet &amp; AI Dashcam</text>
    <rect x="860" y="18" width="185" height="34" rx="17" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="952" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">WASL Live Protocol</text>

    <!-- Map & Fleet Visualization (Left) -->
    <g transform="translate(35, 100)">
      <rect width="640" height="430" rx="16" fill="#020617" stroke="#334155" stroke-width="1"/>
      
      <!-- Simulated Saudi Map Highways -->
      <path d="M 120 380 Q 240 280 340 230 T 520 180" stroke="#1e293b" stroke-width="6" fill="none"/>
      <path d="M 120 380 Q 240 280 340 230 T 520 180" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8 6" fill="none"/>
      
      <path d="M 340 230 L 400 350 L 580 320" stroke="#1e293b" stroke-width="6" fill="none"/>
      <path d="M 340 230 L 400 350 L 580 320" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="6 4" fill="none"/>

      <!-- City Hubs -->
      <!-- Jeddah -->
      <circle cx="120" cy="380" r="7" fill="#ef4444"/>
      <circle cx="120" cy="380" r="14" fill="#ef4444" opacity="0.3"/>
      <text x="135" y="385" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Jeddah Port Hub</text>

      <!-- Riyadh Central -->
      <circle cx="340" cy="230" r="9" fill="#10b981"/>
      <circle cx="340" cy="230" r="18" fill="#10b981" opacity="0.3"/>
      <text x="360" y="225" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Riyadh HQ Dispatch</text>

      <!-- Dammam -->
      <circle cx="520" cy="180" r="7" fill="#3b82f6"/>
      <circle cx="520" cy="180" r="14" fill="#3b82f6" opacity="0.3"/>
      <text x="535" y="175" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Dammam &amp; Jubail</text>

      <!-- Moving Fleet Vehicle Ping -->
      <g transform="translate(260, 275)">
        <rect x="-30" y="-14" width="75" height="28" rx="8" fill="#2563eb" stroke="#60a5fa" stroke-width="1"/>
        <text x="7" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">TRUCK-07</text>
        <circle cx="-18" cy="0" r="4" fill="#4ade80"/>
      </g>

      <g transform="translate(450, 205)">
        <rect x="-30" y="-14" width="75" height="28" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
        <text x="7" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">VAN-14</text>
        <circle cx="-18" cy="0" r="4" fill="#38bdf8"/>
      </g>

      <!-- Bottom overlay on map -->
      <rect x="20" y="370" width="600" height="42" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
      <text x="35" y="396" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Highway 40 (Makkah-Riyadh Corridor) · Live Speed: 88 km/h · Geo-Fence: ACTIVE</text>
    </g>

    <!-- AI Dashcam & Diagnostics (Right) -->
    <g transform="translate(705, 100)">
      <!-- AI Camera Feed Card -->
      <rect width="340" height="205" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="15" y="15" width="310" height="120" rx="10" fill="#020617"/>
      <!-- Dashcam HUD overlay -->
      <text x="30" y="38" fill="#ef4444" font-family="monospace" font-size="11" font-weight="700">● REC · AI DASHCAM DUAL</text>
      <text x="305" y="38" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="end">ADAS + DMS ACTIVE</text>
      
      <!-- AI bounding box for lane -->
      <polygon points="120,115 140,75 180,75 200,115" stroke="#10b981" stroke-width="1.5" fill="none" stroke-dasharray="4 2"/>
      <text x="160" y="95" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">LANE OK</text>

      <g transform="translate(15, 148)">
        <text x="0" y="18" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Driver Fatigue &amp; Speed Shield</text>
        <text x="0" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Automated cloud alert sent to Riyadh safety officer.</text>
      </g>

      <!-- WASL Compliance Stats Card -->
      <g transform="translate(0, 225)">
        <rect width="340" height="205" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="20" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Saudi WASL Gateway Health</text>
        
        <g transform="translate(20, 50)">
          <text x="0" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Telemetry Transmission</text>
          <text x="295" y="20" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="end">99.98%</text>

          <text x="0" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Weight Sensor / Odometer</text>
          <text x="295" y="55" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="end">Calibrated</text>

          <text x="0" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Operating Card (KSA)</text>
          <text x="295" y="90" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="end">Valid 2027</text>

          <text x="0" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Fuel Consumption Audit</text>
          <text x="295" y="125" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="end">-18.4% Cost</text>
        </g>
      </g>
    </g>
  </g>
</svg>
