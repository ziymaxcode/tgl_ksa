<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 650" width="750" height="650">
  <defs>
    <linearGradient id="fleetPhoneBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#09182b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="fleetCardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="750" height="650" fill="url(#fleetPhoneBg)"/>
  <circle cx="650" cy="150" r="180" fill="#3b82f6" opacity="0.15" filter="blur(60px)"/>
  <circle cx="100" cy="500" r="150" fill="#06b6d4" opacity="0.12" filter="blur(50px)"/>

  <!-- Top Ribbon -->
  <g transform="translate(40, 45)">
    <rect width="240" height="34" rx="8" fill="#1e3a8a" fill-opacity="0.6" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="18" cy="17" r="5" fill="#60a5fa"/>
    <text x="35" y="22" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="13" font-weight="700">WASL FLEET PLATFORM</text>
    <text x="670" y="22" fill="#60a5fa" font-family="monospace" font-size="13" text-anchor="end">48 LIVE VEHICLES</text>
  </g>

  <!-- Big Hero Telematics Card -->
  <g transform="translate(40, 100)">
    <rect width="670" height="150" rx="20" fill="url(#fleetCardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">GPS TRACKING &amp; AI DASHCAMS</text>
    <text x="25" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="36" font-weight="800">WASL Certified</text>
    <text x="25" y="122" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Real-Time Telematics across all Saudi Expressways</text>
  </g>

  <!-- Live Mini Highway Radar Map -->
  <g transform="translate(40, 270)">
    <rect width="670" height="180" rx="20" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Highway Line -->
    <path d="M 60 120 Q 240 40 400 90 T 610 60" stroke="#1e293b" stroke-width="8" fill="none"/>
    <path d="M 60 120 Q 240 40 400 90 T 610 60" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="10 6" fill="none"/>

    <!-- Pings -->
    <circle cx="80" cy="115" r="8" fill="#ef4444"/>
    <text x="80" y="145" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Jeddah</text>

    <circle cx="340" cy="75" r="9" fill="#10b981"/>
    <text x="340" y="110" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Riyadh HQ</text>

    <circle cx="580" cy="65" r="8" fill="#3b82f6"/>
    <text x="580" y="95" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Dammam</text>

    <!-- Speed pill -->
    <rect x="25" y="15" width="200" height="30" rx="6" fill="#0f172a" fill-opacity="0.8"/>
    <text x="35" y="35" fill="#38bdf8" font-family="monospace" font-size="12">SPEED: 88 KM/H (CORRIDOR 40)</text>
  </g>

  <!-- Split Driver Safety & Sensors -->
  <g transform="translate(40, 470)">
    <rect width="320" height="135" rx="16" fill="url(#fleetCardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">AI DUAL DASHCAM</text>
    <text x="20" y="68" fill="#34d399" font-family="system-ui, sans-serif" font-size="22" font-weight="800">ADAS + DMS Active</text>
    <text x="20" y="100" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Fatigue &amp; Lane Drift Guard</text>

    <g transform="translate(350, 0)">
      <rect width="320" height="135" rx="16" fill="url(#fleetCardGrad)" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">WASL SENSOR SYNC</text>
      <text x="20" y="68" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="22" font-weight="800">99.98% Uptime</text>
      <text x="20" y="100" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Weight, Odometer, Temp</text>
    </g>
  </g>
</svg>
