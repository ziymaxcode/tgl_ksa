<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="erpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091428"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#erpBg)"/>
  <circle cx="1000" cy="200" r="280" fill="#6366f1" opacity="0.12" filter="blur(80px)"/>
  <circle cx="200" cy="550" r="240" fill="#10b981" opacity="0.1" filter="blur(70px)"/>

  <!-- Top Ribbon -->
  <g transform="translate(60, 50)">
    <rect width="210" height="34" rx="8" fill="#312e81" fill-opacity="0.6" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="18" cy="17" r="5" fill="#a5b4fc"/>
    <text x="35" y="22" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="13" font-weight="700">SAUDI CLOUD ERP &amp; POS</text>
    <text x="1080" y="24" fill="#94a3b8" font-family="monospace" font-size="14" text-anchor="end">MULTI-BRANCH INVENTORY &amp; VAT READY</text>
  </g>

  <!-- Main ERP Container -->
  <g transform="translate(60, 110)">
    <rect width="1080" height="570" rx="24" fill="#0f172a" fill-opacity="0.95" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Header -->
    <rect width="1080" height="70" rx="24" fill="#1e293b" fill-opacity="0.8"/>
    <text x="35" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">TGL Enterprise Cloud ERP · Saudi Arabia Commercial Suite</text>
    <rect x="850" y="18" width="195" height="34" rx="17" fill="#4f46e5" fill-opacity="0.2" stroke="#818cf8" stroke-width="1"/>
    <text x="947" y="40" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Arabic &amp; English RTL/LTR</text>

    <!-- Financial KPI Cards Row -->
    <g transform="translate(35, 100)">
      <rect width="310" height="110" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">MONTHLY REVENUE (SAR)</text>
      <text x="20" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">842,500 <tspan font-size="18" fill="#94a3b8">SAR</tspan></text>
      <text x="20" y="96" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">▲ +24.6% vs Last Quarter</text>
    </g>

    <g transform="translate(385, 100)">
      <rect width="310" height="110" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">VAT 15% ACCRUALS</text>
      <text x="20" y="75" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="34" font-weight="800">126,375 <tspan font-size="18" fill="#94a3b8">SAR</tspan></text>
      <text x="20" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Automatic ZATCA Return Preparation</text>
    </g>

    <g transform="translate(735, 100)">
      <rect width="310" height="110" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ACTIVE BRANCH STORES</text>
      <text x="20" y="75" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="34" font-weight="800">6 Locations</text>
      <text x="20" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Riyadh, Jeddah, Khobar &amp; Dammam</text>
    </g>

    <!-- Bottom Chart & POS Ledger -->
    <g transform="translate(35, 240)">
      <rect width="660" height="290" rx="16" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <text x="25" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Multi-Branch Cashflow &amp; Inventory Turnover</text>
      
      <!-- Visual Bar Chart -->
      <g transform="translate(25, 70)">
        <!-- Riyadh HQ -->
        <rect x="20" y="40" width="45" height="150" rx="4" fill="#3b82f6"/>
        <text x="42" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Riyadh 1</text>

        <!-- Riyadh Olaya -->
        <rect x="100" y="60" width="45" height="130" rx="4" fill="#2563eb"/>
        <text x="122" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Olaya</text>

        <!-- Jeddah Corniche -->
        <rect x="180" y="20" width="45" height="170" rx="4" fill="#10b981"/>
        <text x="202" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Jeddah</text>

        <!-- Dammam Port -->
        <rect x="260" y="70" width="45" height="120" rx="4" fill="#0ea5e9"/>
        <text x="282" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Dammam</text>

        <!-- Khobar Hub -->
        <rect x="340" y="90" width="45" height="100" rx="4" fill="#6366f1"/>
        <text x="362" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Khobar</text>

        <!-- Jubail Ind -->
        <rect x="420" y="110" width="45" height="80" rx="4" fill="#8b5cf6"/>
        <text x="442" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Jubail</text>

        <!-- Trend Line -->
        <path d="M 42 120 L 122 135 L 202 90 L 282 140 L 362 160 L 442 180" stroke="#f59e0b" stroke-width="3" fill="none"/>
        <circle cx="202" cy="90" r="5" fill="#fbbf24"/>
      </g>
    </g>

    <!-- Right POS / Audit Card -->
    <g transform="translate(735, 240)">
      <rect width="310" height="290" rx="16" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <text x="20" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Enterprise Modules</text>
      
      <g transform="translate(20, 55)">
        <rect width="270" height="45" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="15" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">General Ledger &amp; 15% VAT</text>
        <text x="255" y="28" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="end">✓ Active</text>
      </g>

      <g transform="translate(20, 110)">
        <rect width="270" height="45" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="15" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">POS &amp; Barcode Integration</text>
        <text x="255" y="28" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="end">✓ Synced</text>
      </g>

      <g transform="translate(20, 165)">
        <rect width="270" height="45" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="15" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">WPS Saudi Payroll (Mudad)</text>
        <text x="255" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="end">Auto-File</text>
      </g>

      <g transform="translate(20, 220)">
        <rect width="270" height="45" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="15" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Batch &amp; Expiry Tracking</text>
        <text x="255" y="28" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="end">Real-Time</text>
      </g>
    </g>
  </g>
</svg>
